<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Predictor</title>
<style>
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background: linear-gradient(135deg, #e0eafc, #cfdef3); /* Smooth gradient background */
        display: flex; 
        justify-content: center; 
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .card { 
        background: white; 
        padding: 40px; 
        border-radius: 15px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        width: 420px;
        transition: transform 0.3s ease; /* Card lifts slightly on hover */
    }

    .card:hover {
        transform: translateY(-5px);
    }

    h2 { 
        text-align: center; 
        color: #2c3e50; 
        margin-top: 0;
        letter-spacing: 1px;
    }

    .input-group { margin-bottom: 20px; }

    label { 
        display: block; 
        margin-bottom: 8px; 
        font-weight: 600; 
        color: #555;
        font-size: 14px;
    }

    /* Style for Inputs and Select boxes */
    input, select { 
        width: 100%; 
        padding: 12px; 
        border: 2px solid #eee; 
        border-radius: 8px; 
        box-sizing: border-box; 
        font-size: 15px;
        transition: all 0.3s ease; /* Smooth transition for focus */
        outline: none;
    }

    /* Hover effect for inputs */
    input:hover, select:hover {
        border-color: #d1d1d1;
    }

    /* Focus effect (when you click inside) */
    input:focus, select:focus { 
        border-color: #007bff; 
        box-shadow: 0 0 8px rgba(0,123,255,0.2);
        background-color: #fff;
    }

    /* Button Styling */
    button { 
        width: 100%; 
        padding: 14px; 
        background-color: #007bff; /* Changed to a nice blue */
        color: white; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        font-size: 16px; 
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease; 
        margin-top: 10px;
    }

    /* Button Hover and Active states */
    button:hover { 
        background-color: #0056b3; 
        box-shadow: 0 5px 15px rgba(0,91,187,0.3);
        transform: scale(1.02); /* Button grows slightly */
    }

    button:active {
        transform: scale(0.98); /* Button "pushes in" when clicked */
    }

    /* Result area styling */
    #result { 
        margin-top: 25px; 
        padding: 15px;
        text-align: center; 
        font-size: 1.3rem; 
        font-weight: bold; 
        color: #28a745; /* Success Green */
        background-color: #f8fff9;
        border-radius: 8px;
        border: 1px solid #e1f5e5;
        min-height: 30px; /* Prevents card jumping when result appears */
    }
</style>
</head>
<body>

<div class="card">
    <h2>Price Predictor</h2>
    
    <div class="input-group">
        <label>Area (Square Feet)</label>
        <input type="number" id="uiSqft" placeholder="e.g. 1000" value="1000">
    </div>

    <div class="input-group">
        <label>BHK</label>
        <input type="number" id="uiBHK" placeholder="Number of bedrooms" value="2">
    </div>

    <div class="input-group">
        <label>Bathrooms</label>
        <input type="number" id="uiBath" placeholder="Number of bathrooms" value="2">
    </div>

    <div class="input-group">
        <label>Location</label>
        <select id="uiLocations">
            <option disabled selected>Choose a location</option>
            </select>
    </div>

    <button onclick="onClickedEstimatePrice()">Estimate Price</button>

    <div id="result"></div>
</div>

<script>
    // 1. Function to load locations from Backend when page opens
    async function loadLocations() {
        const response = await fetch("http://127.0.0.1:8000/location_name");
        const data = await response.json();
        const uiLocations = document.getElementById("uiLocations");

        data.location.forEach(loc => {
            let option = new Option(loc, loc); // (text, value)
            uiLocations.add(option);
        });
    }

    // 2. Function to send data to Backend and get Price
    async function onClickedEstimatePrice() {
        const sqft = document.getElementById("uiSqft").value;
        const bhk = document.getElementById("uiBHK").value;
        const bath = document.getElementById("uiBath").value;
        const location = document.getElementById("uiLocations").value;
        const resultDiv = document.getElementById("result");

        resultDiv.innerHTML = "Estimating...";

        const response = await fetch("http://127.0.0.1:8000/predict_home_price", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                total_sqft: parseFloat(sqft),
                bhk: parseInt(bhk),
                bath: parseInt(bath),
                location: location
            })
        });

        const data = await response.json();
        resultDiv.innerHTML = "Estimated Price: ₹ " + data.estimated_price + " Lakhs";
    }

    // Call loadLocations as soon as the page loads
    window.onload = loadLocations;
</script>

</body>
</html>
